<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Reader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        header {
            width: 100%;
            max-width: 640px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .version-badge {
            font-size: 0.75rem;
            color: #64748b;
            margin-left: 8px;
        }

        .scanner-wrapper {
            width: 100%;
            max-width: 540px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        #qr-reader {
            width: 100%;
        }

        .result-panel {
            width: 100%;
            max-width: 540px;
            margin-top: 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }

        .result-panel h2 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 12px;
        }

        #result-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #result-list li {
            background: #0f172a;
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            word-break: break-all;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        #result-list li .tag {
            font-size: 0.7rem;
            font-weight: 700;
            background: #1d4ed8;
            color: #bfdbfe;
            padding: 2px 7px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 1px;
        }

        #result-list li .text {
            color: #7dd3fc;
        }

        #result-empty {
            color: #475569;
            font-size: 0.85rem;
            font-style: italic;
        }

        footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #334155;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>QR Code Reader <span class="version-badge" id="version-badge">v1.0.0</span></h1>
    </div>
</header>

<div class="scanner-wrapper">
    <div id="qr-reader"></div>
</div>

<div class="result-panel">
    <h2>Resultados</h2>
    <ul id="result-list">
        <li id="result-empty" style="border:none;background:none;padding:0">Nenhum código lido ainda.</li>
    </ul>
</div>

<footer>QR Code Reader &mdash; v1.0.0</footer>

<script src="./html5-qrcode.min.js"></script>
<script>
    function onScanSuccess(decodedText, decodedResult) {
        var list = document.getElementById("result-list");
        var empty = document.getElementById("result-empty");
        if (empty) empty.remove();

        var format = (decodedResult && decodedResult.result && decodedResult.result.format)
            ? decodedResult.result.format.formatName
            : "QR";

        var item = document.createElement("li");
        item.innerHTML =
            '<span class="tag">' + format + '</span>' +
            '<span class="text">' + escapeHtml(decodedText) + '</span>';

        list.insertBefore(item, list.firstChild);
        if (list.children.length > 10) list.removeChild(list.lastChild);
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function docReady(fn) {
        if (document.readyState === "complete" || document.readyState === "interactive") {
            setTimeout(fn, 1);
        } else {
            document.addEventListener("DOMContentLoaded", fn);
        }
    }

    docReady(function () {
        var scanner = new Html5QrcodeScanner(
            "qr-reader",
            {
                fps: 10,
                qrbox: { width: 280, height: 280 },
                rememberLastUsedCamera: true,
                showTorchButtonIfSupported: true,
            },
            false
        );
        scanner.render(onScanSuccess);
    });
</script>
</body>
</html>
